                  allowCredentials:
                    description: AllowCredentials allows credentials.
                    type: boolean
                  allowHeaders:
                    description: AllowHeaders is the list of allowed headers.
                    items:
                      type: string
                    type: array
                  allowMethods:
                    description: AllowMethods is the list of allowed HTTP methods.
                    items:
                      type: string
                    type: array
                  allowOrigins:
                    description: AllowOrigins is the list of allowed origins.
                    items:
                      type: string
                    type: array
                  exposeHeaders:
                    description: ExposeHeaders is the list of headers to expose.
                    items:
                      type: string
                    type: array
                  maxAge:
                    description: MaxAge is the maximum age for preflight cache in
                      seconds.
                    type: integer
                type: object
              headers:
                description: Headers contains header manipulation configuration.
                properties:
                  request:
                    description: Request contains request header operations.
                    properties:
                      add:
                        additionalProperties:
                          type: string
                        description: Add appends header values.
                        type: object
                      remove:
                        description: Remove removes headers.
                        items:
                          type: string
                        type: array
                      set:
                        additionalProperties:
                          type: string
                        description: Set replaces header values.
                        type: object
                    type: object
                  response:
                    description: Response contains response header operations.
                    properties:
                      add:
                        additionalProperties:
                          type: string
                        description: Add appends header values.
                        type: object
                      remove:
                        description: Remove removes headers.
                        items:
                          type: string
                        type: array
                      set:
                        additionalProperties:
                          type: string
                        description: Set replaces header values.
                        type: object
                    type: object
                type: object
              match:
                description: Match contains the matching conditions for this route.
                items:
                  description: |-
                    MCPRouteMatch represents matching conditions for an MCP route. Matches are
                    derivable from mirrored headers alone (HUB-148): Method mirrors Mcp-Method
                    and Name mirrors Mcp-Name.
                  properties:
                    headers:
                      description: Headers matches HTTP headers.
                      items:
                        description: HeaderMatch represents header matching configuration.
                        properties:
                          absent:
                            description: Absent matches if the header is NOT present.
                            type: boolean
                          exact:
                            description: Exact matches the header value exactly.
                            type: string
                          name:
                            description: Name is the header name.
                            minLength: 1
                            type: string
                          prefix:
                            description: Prefix matches header values starting with
                              this prefix.
                            type: string
                          present:
                            description: Present matches if the header is present
                              (regardless of value).
                            type: boolean
                          regex:
                            description: Regex matches header values using a regular
                              expression.
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    method:
                      description: Method matches the MCP method (mirrored into the
                        Mcp-Method header).
                      type: string
                    name:
                      description: |-
                        Name matches the MCP primitive name (mirrored into the Mcp-Name
                        header) for tools/call, resources/read and prompts/get.
                      properties:
                        exact:
                          description: Exact matches the string exactly.
                          type: string
                        prefix:
                          description: Prefix matches strings starting with this prefix.
                          type: string
                        regex:
                          description: Regex matches strings using a regular expression.
                          type: string
                      type: object
                    path:
                      description: Path matches the HTTP path for the MCP endpoint.
                      properties:
                        exact:
                          description: Exact matches the string exactly.
                          type: string
                        prefix:
                          description: Prefix matches strings starting with this prefix.
                          type: string
                        regex:
                          description: Regex matches strings using a regular expression.
                          type: string
                      type: object
                  type: object
                type: array
              rateLimit:
                description: RateLimit contains route-level rate limiting configuration.
                properties:
                  burst:
                    description: Burst is the maximum burst size.
                    minimum: 1
                    type: integer
                  enabled:
                    default: false
                    description: Enabled enables rate limiting.
                    type: boolean
                  perClient:
                    description: PerClient enables per-client rate limiting.
                    type: boolean
                  redis:
                    description: |-
                      Redis contains Redis connection configuration for the distributed
                      rate limiter. Required when Store is "redis"; must be omitted otherwise.
                    properties:
                      connectTimeout:
                        description: ConnectTimeout is the timeout for establishing
                          connections.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                      failOpen:
                        description: |-
                          FailOpen controls the behavior when Redis is unavailable.
                          When true (default), requests are allowed through and a failure
                          metric is incremented; when false, requests are rejected with 429.
                        type: boolean
                      keyPrefix:
                        description: KeyPrefix is a prefix added to all rate limiter
                          keys.
                        type: string
                      passwordVaultPath:
                        description: |-
                          PasswordVaultPath is the Vault path for the Redis password (standalone mode).
                          The secret should have a "password" key. Format: mount/path.
                        type: string
                      poolSize:
                        description: PoolSize is the maximum number of connections
                          in the pool.
                        minimum: 1
                        type: integer
                      readTimeout:
                        description: |-
                          ReadTimeout is the timeout for read operations. It also bounds a
                          single rate limit decision so Redis latency never adds unbounded
                          delay to requests (default 100ms).
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                      retry:
                        description: Retry contains retry configuration for the initial
                          connection.
                        properties:
                          initialBackoff:
                            description: |-
                              InitialBackoff is the initial backoff duration between retries.
                              Default is 100ms.
                            pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                            type: string
                          maxBackoff:
                            description: |-
                              MaxBackoff is the maximum backoff duration between retries.
                              Default is 30s.
                            pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                            type: string
                          maxRetries:
                            description: |-
                              MaxRetries is the maximum number of retry attempts for the initial
                              connection. Default is 3.
                            minimum: 0
                            type: integer
                        type: object
                      sentinel:
                        description: |-
                          Sentinel configures Redis Sentinel connection for high availability.
                          Mutually exclusive with standalone Redis URL.
                        properties:
                          db:
                            description: DB is the Redis database number.
                            maximum: 15
                            minimum: 0
                            type: integer
                          masterName:
                            description: MasterName is the name of the Redis master
                              monitored by Sentinel.
                            minLength: 1
                            type: string
                          password:
                            description: Password is the password for the Redis master.
                            type: string
                          passwordVaultPath:
                            description: |-
                              PasswordVaultPath is the Vault path for the Redis master password.
                              The secret should have a "password" key. Format: mount/path.
                            type: string
                          sentinelAddrs:
                            description: SentinelAddrs is the list of Sentinel addresses
                              (host:port).
                            items:
                              type: string
                            minItems: 1
                            type: array
                          sentinelPassword:
                            description: SentinelPassword is the password for Sentinel
                              authentication.
                            type: string
                          sentinelPasswordVaultPath:
                            description: |-
                              SentinelPasswordVaultPath is the Vault path for the Sentinel password.
                              The secret should have a "password" key. Format: mount/path.
                            type: string
                        required:
                        - masterName
                        - sentinelAddrs
                        type: object
                      tls:
                        description: TLS contains TLS configuration for the Redis
                          connection.
                        properties:
                          caFile:
                            description: CAFile is the path to the CA certificate
                              file for server verification.
                            type: string
                          certFile:
                            description: CertFile is the path to the client certificate
                              file (mTLS).
                            type: string
                          enabled:
                            default: false
                            description: Enabled enables TLS for the Redis connection.
                            type: boolean
                          insecureSkipVerify:
                            description: InsecureSkipVerify skips server certificate
                              verification (dev only).
                            type: boolean
                          keyFile:
                            description: KeyFile is the path to the client private
                              key file (mTLS).
                            type: string
                          maxVersion:
                            description: MaxVersion is the maximum TLS version.
                            enum:
                            - TLS12
                            - TLS13
                            type: string
                          minVersion:
                            description: MinVersion is the minimum TLS version (TLS12,
                              TLS13).
                            enum:
                            - TLS12
                            - TLS13
                            type: string
                        required:
                        - enabled
                        type: object
                      url:
                        description: |-
                          URL is the Redis connection URL for standalone mode.
                          Format: redis://[user:password@]host:port[/db]
                          Mutually exclusive with Sentinel configuration.
                        type: string
                      writeTimeout:
                        description: WriteTimeout is the timeout for write operations.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                    type: object
                  requestsPerSecond:
                    description: RequestsPerSecond is the maximum requests per second.
                    minimum: 1
                    type: integer
                  store:
                    default: memory
                    description: |-
                      Store is the rate limiter state store (memory, redis).
                      "memory" keeps token buckets local to each gateway instance;
                      "redis" shares token buckets across gateway instances through
                      Redis (standalone or Sentinel) for distributed rate limiting.
                    enum:
                    - memory
                    - redis
                    type: string
                required:
                - burst
                - enabled
                - requestsPerSecond
                type: object
              retries:
                description: Retries contains retry policy configuration.
                properties:
                  attempts:
                    default: 3
                    description: Attempts is the maximum number of retry attempts.
                    maximum: 10
                    minimum: 1
                    type: integer
                  perTryTimeout:
                    description: PerTryTimeout is the timeout for each retry attempt.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                  retryOn:
                    description: |-
                      RetryOn is a comma-separated list of conditions to retry on.
                      For HTTP: 5xx, reset, connect-failure, retriable-4xx, refused-stream, etc.
                      For gRPC: canceled, deadline-exceeded, internal, resource-exhausted, unavailable.
                    type: string
                required:
                - attempts
                type: object
              scopeMap:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  ScopeMap maps a primitive or method to the OAuth scopes required to
                  invoke it (HUB-305/306).
                type: object
              security:
                description: Security configures security headers for this MCP route
                  (overrides global).
                properties:
                  csp:
                    description: CSP configures Content Security Policy.
                    properties:
                      enabled:
                        default: false
                        description: Enabled enables CSP.
                        type: boolean
                      policy:
                        description: Policy is the full CSP policy string.
                        type: string
                      reportOnly:
                        description: |-
                          ReportOnly sets the Content-Security-Policy-Report-Only header instead
                          of Content-Security-Policy.
                        type: boolean
                      reportUri:
                        description: ReportURI is the URI to report CSP violations
                          to.
                        type: string
                    required:
                    - enabled
                    type: object
                  enabled:
                    default: false
                    description: Enabled enables security features.
                    type: boolean
                  headers:
                    description: Headers configures security headers.
                    properties:
                      contentSecurityPolicy:
                        description: |-
                          ContentSecurityPolicy sets the Content-Security-Policy header.

                          Deprecated: use SecurityConfig.CSP instead. The gateway consumes CSP
                          from the structured security.csp block; the operator converts this
                          legacy field into security.csp when csp is not set.
                        type: string
                      customHeaders:
                        additionalProperties:
                          type: string
                        description: CustomHeaders sets additional custom security
                          headers.
                        type: object
                      enabled:
                        default: false
                        description: Enabled enables security headers.
                        type: boolean
                      strictTransportSecurity:
                        description: |-
                          StrictTransportSecurity sets the Strict-Transport-Security header.

                          Deprecated: use SecurityConfig.HSTS instead. The gateway consumes HSTS
                          from the structured security.hsts block; the operator parses this
                          legacy raw header value into security.hsts when hsts is not set.
                        type: string
                      xContentTypeOptions:
                        description: XContentTypeOptions sets the X-Content-Type-Options
                          header.
                        type: string
                      xFrameOptions:
                        description: XFrameOptions sets the X-Frame-Options header.
                        type: string
                      xXSSProtection:
                        description: XXSSProtection sets the X-XSS-Protection header.
                        type: string
                    required:
                    - enabled
                    type: object
                  hsts:
                    description: HSTS configures HTTP Strict Transport Security.
                    properties:
                      enabled:
                        default: false
                        description: Enabled enables HSTS.
                        type: boolean
                      includeSubDomains:
                        description: IncludeSubDomains adds the includeSubDomains
                          directive.
                        type: boolean
                      maxAge:
                        description: MaxAge is the max-age directive value in seconds.
                        minimum: 0
                        type: integer
                      preload:
                        description: Preload adds the preload directive.
                        type: boolean
                    required:
                    - enabled
                    type: object
                  referrerPolicy:
                    description: ReferrerPolicy sets the Referrer-Policy header.
                    type: string
                required:
                - enabled
                type: object
              timeout:
                description: Timeout is the request timeout for this route.
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                type: string
              tls:
                description: TLS configures route-level TLS certificate override for
                  this MCP route.
                properties:
                  certFile:
                    description: CertFile is the path to the route-specific certificate
                      file (PEM format).
                    type: string
                  cipherSuites:
                    description: CipherSuites is the list of allowed cipher suites.
                    items:
                      type: string
                    type: array
                  clientValidation:
                    description: ClientValidation configures client certificate validation.
                    properties:
                      allowedCNs:
                        description: AllowedCNs is the list of allowed Common Names
                          for client certificates.
                        items:
                          type: string
                        type: array
                      allowedSANs:
                        description: AllowedSANs is the list of allowed Subject Alternative
                          Names.
                        items:
                          type: string
                        type: array
                      caFile:
                        description: CAFile is the path to the CA certificate file
                          for client validation.
                        type: string
                      enabled:
                        default: false
                        description: Enabled enables client certificate validation.
                        type: boolean
                      requireClientCert:
                        description: RequireClientCert requires client certificate.
                        type: boolean
                    required:
                    - enabled
                    type: object
                  keyFile:
                    description: KeyFile is the path to the route-specific private
                      key file (PEM format).
                    type: string
                  maxVersion:
                    description: MaxVersion is the maximum TLS version.
                    enum:
                    - TLS12
                    - TLS13
                    type: string
                  minVersion:
                    description: MinVersion is the minimum TLS version (TLS12, TLS13).
                    enum:
                    - TLS12
                    - TLS13
                    type: string
                  sniHosts:
                    description: SNIHosts is the list of SNI hostnames this certificate
                      should be used for.
                    items:
                      type: string
                    type: array
                  vault:
                    description: Vault configures Vault-based certificate management.
                    properties:
                      altNames:
                        description: AltNames for certificate requests.
                        items:
                          type: string
                        type: array
                      commonName:
                        description: CommonName for certificate requests.
                        type: string
                      enabled:
                        default: false
                        description: Enabled enables Vault integration.
                        type: boolean
                      pkiMount:
                        description: PKIMount is the Vault PKI mount path.
                        type: string
                      role:
                        description: Role is the Vault PKI role name.
                        type: string
                      ttl:
                        description: TTL for certificate requests.
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              upstreams:
                description: |-
                  Upstreams lists the MCPBackend names this route fans out to (legacy,
                  equal weight). Mutually exclusive with WeightedUpstreams.
                items:
                  type: string
                type: array
              weightedUpstreams:
                description: |-
                  WeightedUpstreams lists MCPBackend references with traffic weights for
                  single-upstream selection (canary / A-B). Mutually exclusive with
                  Upstreams. Aggregation and subscription fan-out still cover ALL
                  referenced upstreams regardless of weight.
                items:
                  description: |-
                    MCPUpstreamRef references an MCPBackend with an optional traffic weight.
                    It mirrors config.MCPUpstreamRef so weighted MCP routing follows the same
                    0-100 / sum-to-100 semantics as APIRoute destinations.
                  properties:
                    name:
                      description: Name is the referenced MCPBackend name.
                      minLength: 1
                      type: string
                    weight:
                      description: |-
                        Weight is the relative traffic weight (0-100). Zero-weight refs receive
                        no traffic when any sibling has a positive weight; when all weights are
                        zero, selection is uniform.
                      maximum: 100
                      minimum: 0
                      type: integer
                  required:
                  - name
                  type: object
                type: array
            type: object
          status:
            description: MCPRouteStatus defines the observed state of MCPRoute.
            properties:
              appliedGateways:
                description: AppliedGateways is the list of gateways where this route
                  has been applied.
                items:
                  description: AppliedGateway represents a gateway where the configuration
                    has been applied.
                  properties:
                    lastApplied:
                      description: LastApplied is the timestamp when the configuration
                        was last applied.
                      format: date-time
                      type: string
                    name:
                      description: Name of the gateway.
                      type: string
                    namespace:
                      description: Namespace of the gateway.
                      type: string
                  required:
                  - lastApplied
                  - name
                  - namespace
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the MCPRoute's state.
                items:
                  description: Condition represents a condition of a resource.
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable message indicating
                        details about the transition.
                      type: string
                    observedGeneration:
                      description: ObservedGeneration represents the .metadata.generation
                        that the condition was set based upon.
                      format: int64
                      type: integer
                    reason:
                      description: Reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition (True, False, Unknown).
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
