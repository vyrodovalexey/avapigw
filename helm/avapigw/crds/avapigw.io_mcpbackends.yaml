---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: mcpbackends.avapigw.io
spec:
  group: avapigw.io
  names:
    kind: MCPBackend
    listKind: MCPBackendList
    plural: mcpbackends
    shortNames:
    - mcpbe
    singular: mcpbackend
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Healthy')].status
      name: Healthy
      type: string
    - jsonPath: .status.healthyHosts
      name: Hosts
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MCPBackend is the Schema for the mcpbackends API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MCPBackendSpec defines the desired state of MCPBackend. It mirrors the
              gateway config.MCPBackend (MCPUpstream) type (HUB-503) and reuses the shared
              backend infrastructure via MCPBackendToBackend in the gateway.
            properties:
              allow:
                description: |-
                  Allow restricts which primitives are exposed from this upstream
                  (HUB-503 allow list). Empty means allow all (subject to Deny).
                items:
                  type: string
                type: array
              cacheTTLClamp:
                description: CacheTTLClamp clamps aggregated cache TTLs for this upstream
                  (HUB-182).
                properties:
                  max:
                    description: Max is the upper clamp for cache TTLs.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                  min:
                    description: Min is the lower clamp for cache TTLs.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                type: object
              circuitBreaker:
                description: CircuitBreaker configures circuit breaking for this upstream
                  (HUB-504).
                properties:
                  enabled:
                    default: false
                    description: Enabled enables circuit breaker.
                    type: boolean
                  halfOpenRequests:
                    description: HalfOpenRequests is the number of requests to allow
                      in half-open state.
                    type: integer
                  threshold:
                    description: Threshold is the number of failures before opening
                      the circuit.
                    minimum: 1
                    type: integer
                  timeout:
                    description: Timeout is the time to wait before attempting to
                      close the circuit.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                required:
                - enabled
                - threshold
                - timeout
                type: object
              credential:
                description: |-
                  Credential configures the independent upstream credential source; the
                  downstream client token is never forwarded (HUB-303/304).
                properties:
                  basic:
                    description: Basic configures Basic authentication for backend.
                    properties:
                      enabled:
                        default: false
                        description: Enabled enables Basic authentication.
                        type: boolean
                      password:
                        description: Password is the password for Basic auth.
                        type: string
                      passwordKey:
                        default: password
                        description: 'PasswordKey is the key in Vault for password
                          (default: password).'
                        type: string
                      username:
                        description: Username is the username for Basic auth.
                        type: string
                      usernameKey:
                        default: username
                        description: 'UsernameKey is the key in Vault for username
                          (default: username).'
                        type: string
                      vaultPath:
                        description: VaultPath is the Vault path for credentials.
                        type: string
                    required:
                    - enabled
                    type: object
                  jwt:
                    description: JWT configures JWT authentication for backend.
                    properties:
                      enabled:
                        default: false
                        description: Enabled enables JWT authentication.
                        type: boolean
                      headerName:
                        default: Authorization
                        description: 'HeaderName is the header name for the token
                          (default: Authorization).'
                        type: string
                      headerPrefix:
                        default: Bearer
                        description: 'HeaderPrefix is the prefix for the token (default:
                          Bearer).'
                        type: string
                      oidc:
                        description: OIDC configures OIDC token acquisition.
                        properties:
                          clientId:
                            description: ClientID is the OIDC client ID.
                            minLength: 1
                            type: string
                          clientSecret:
                            description: ClientSecret is the OIDC client secret.
                            type: string
                          clientSecretRef:
                            description: ClientSecretRef references a Kubernetes secret
                              containing the client secret.
                            properties:
                              key:
                                description: Key is the key in the secret.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the name of the secret.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          issuerUrl:
                            description: IssuerURL is the OIDC issuer URL.
                            minLength: 1
                            type: string
                          scopes:
                            description: Scopes are the scopes to request.
                            items:
                              type: string
                            type: array
                          tokenCacheTTL:
                            description: TokenCacheTTL is the TTL for cached tokens.
                            pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                            type: string
                        required:
                        - clientId
                        - issuerUrl
                        type: object
                      staticToken:
                        description: StaticToken is a static JWT token (for development
                          only).
                        type: string
                      tokenSource:
                        description: TokenSource specifies where to get the token
                          (static, vault, oidc).
                        enum:
                        - static
                        - vault
                        - oidc
                        type: string
                      vaultPath:
                        description: VaultPath is the Vault path for JWT token.
                        type: string
                    required:
                    - enabled
                    - tokenSource
                    type: object
                  mtls:
                    description: MTLS configures mTLS authentication for backend.
                    properties:
                      caFile:
                        description: CAFile is the path to the CA certificate for
                          server verification.
                        type: string
                      certFile:
                        description: CertFile is the path to the client certificate.
                        type: string
                      enabled:
                        default: false
                        description: Enabled enables mTLS authentication.
                        type: boolean
                      keyFile:
                        description: KeyFile is the path to the client private key.
                        type: string
                      vault:
                        description: Vault configures Vault-based certificate management.
                        properties:
                          altNames:
                            description: AltNames for certificate requests.
                            items:
                              type: string
                            type: array
                          commonName:
                            description: CommonName for certificate requests.
                            type: string
                          enabled:
                            default: false
                            description: Enabled enables Vault integration for client
                              certificates.
                            type: boolean
                          pkiMount:
                            description: PKIMount is the Vault PKI mount path.
                            type: string
                          role:
                            description: Role is the Vault PKI role name.
                            type: string
                          ttl:
                            description: TTL for certificate requests.
                            type: string
                        required:
                        - enabled
                        type: object
                    required:
                    - enabled
                    type: object
                  type:
                    description: Type specifies the authentication type (jwt, basic,
                      mtls).
                    enum:
                    - jwt
                    - basic
                    - mtls
                    type: string
                required:
                - type
                type: object
              deny:
                description: Deny excludes primitives from this upstream (HUB-503
                  deny list).
                items:
                  type: string
                type: array
              era:
                description: 'Era pins the protocol era: "modern", "legacy" or ""
                  (auto-detect).'
                enum:
                - modern
                - legacy
                type: string
              healthCheck:
                description: HealthCheck contains health check configuration.
                properties:
                  grpcService:
                    description: |-
                      GRPCService is the service name for gRPC health check requests.
                      An empty string checks overall server health.
                    type: string
                  healthyThreshold:
                    default: 2
                    description: HealthyThreshold is the number of consecutive successes
                      to mark healthy.
                    minimum: 1
                    type: integer
                  interval:
                    description: Interval is the health check interval.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                  path:
                    description: |-
                      Path is the health check path. Ignored when UseGRPC is true (gRPC
                      health checks address the grpc.health.v1.Health service instead).
                    minLength: 1
                    type: string
                  port:
                    description: |-
                      Port overrides the backend host port for health checks. Useful for
                      backends that expose a separate monitoring/probe port.
                    maximum: 65535
                    minimum: 1
                    type: integer
                  timeout:
                    description: Timeout is the health check timeout.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                  unhealthyThreshold:
                    default: 3
                    description: UnhealthyThreshold is the number of consecutive failures
                      to mark unhealthy.
                    minimum: 1
                    type: integer
                  useGRPC:
                    description: |-
                      UseGRPC enables native gRPC health checking using
                      grpc.health.v1.Health/Check instead of HTTP GET.
                    type: boolean
                required:
                - path
                type: object
              hosts:
                description: Hosts contains the upstream host configurations.
                items:
                  description: BackendHost represents a single backend host.
                  properties:
                    address:
                      description: Address is the backend host address (IP or hostname).
                      minLength: 1
                      type: string
                    port:
                      description: Port is the backend port.
                      maximum: 65535
                      minimum: 1
                      type: integer
                    weight:
                      default: 1
                      description: Weight is the traffic weight for this host (0-100).
                      maximum: 100
                      minimum: 0
                      type: integer
                  required:
                  - address
                  - port
                  type: object
                minItems: 1
                type: array
              loadBalancer:
                description: LoadBalancer contains load balancer configuration.
                properties:
                  algorithm:
                    default: roundRobin
                    description: Algorithm is the load balancing algorithm.
                    enum:
                    - roundRobin
                    - weighted
                    - leastConn
                    - random
                    type: string
                type: object
              namespacePrefix:
                description: |-
                  NamespacePrefix is the prefix applied when namespacing this upstream's
                  primitives (HUB-162). Defaults to the resource name when unset.
                type: string
              path:
                description: 'Path is the upstream MCP endpoint path. Default: /mcp.'
                type: string
              pinnedVersion:
                description: PinnedVersion pins a specific protocol version, bypassing
                  probing (HUB-724).
                type: string
              rateLimit:
                description: RateLimit configures rate limiting for this upstream.
                properties:
                  burst:
                    description: Burst is the maximum burst size.
                    minimum: 1
                    type: integer
                  enabled:
                    default: false
                    description: Enabled enables rate limiting.
                    type: boolean
                  perClient:
                    description: PerClient enables per-client rate limiting.
                    type: boolean
                  redis:
                    description: |-
                      Redis contains Redis connection configuration for the distributed
                      rate limiter. Required when Store is "redis"; must be omitted otherwise.
                    properties:
                      connectTimeout:
                        description: ConnectTimeout is the timeout for establishing
                          connections.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                      failOpen:
                        description: |-
                          FailOpen controls the behavior when Redis is unavailable.
                          When true (default), requests are allowed through and a failure
                          metric is incremented; when false, requests are rejected with 429.
                        type: boolean
                      keyPrefix:
                        description: KeyPrefix is a prefix added to all rate limiter
                          keys.
                        type: string
                      passwordVaultPath:
                        description: |-
                          PasswordVaultPath is the Vault path for the Redis password (standalone mode).
                          The secret should have a "password" key. Format: mount/path.
                        type: string
                      poolSize:
                        description: PoolSize is the maximum number of connections
                          in the pool.
                        minimum: 1
                        type: integer
                      readTimeout:
                        description: |-
                          ReadTimeout is the timeout for read operations. It also bounds a
                          single rate limit decision so Redis latency never adds unbounded
                          delay to requests (default 100ms).
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                      retry:
                        description: Retry contains retry configuration for the initial
                          connection.
                        properties:
                          initialBackoff:
                            description: |-
                              InitialBackoff is the initial backoff duration between retries.
                              Default is 100ms.
                            pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                            type: string
                          maxBackoff:
                            description: |-
                              MaxBackoff is the maximum backoff duration between retries.
                              Default is 30s.
                            pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                            type: string
                          maxRetries:
                            description: |-
                              MaxRetries is the maximum number of retry attempts for the initial
                              connection. Default is 3.
                            minimum: 0
                            type: integer
                        type: object
                      sentinel:
                        description: |-
                          Sentinel configures Redis Sentinel connection for high availability.
                          Mutually exclusive with standalone Redis URL.
                        properties:
                          db:
                            description: DB is the Redis database number.
                            maximum: 15
                            minimum: 0
                            type: integer
                          masterName:
                            description: MasterName is the name of the Redis master
                              monitored by Sentinel.
                            minLength: 1
                            type: string
                          password:
                            description: Password is the password for the Redis master.
                            type: string
                          passwordVaultPath:
                            description: |-
                              PasswordVaultPath is the Vault path for the Redis master password.
                              The secret should have a "password" key. Format: mount/path.
                            type: string
                          sentinelAddrs:
                            description: SentinelAddrs is the list of Sentinel addresses
                              (host:port).
                            items:
                              type: string
                            minItems: 1
                            type: array
                          sentinelPassword:
                            description: SentinelPassword is the password for Sentinel
                              authentication.
                            type: string
                          sentinelPasswordVaultPath:
                            description: |-
                              SentinelPasswordVaultPath is the Vault path for the Sentinel password.
                              The secret should have a "password" key. Format: mount/path.
                            type: string
                        required:
                        - masterName
                        - sentinelAddrs
                        type: object
                      tls:
                        description: TLS contains TLS configuration for the Redis
                          connection.
                        properties:
                          caFile:
                            description: CAFile is the path to the CA certificate
                              file for server verification.
                            type: string
                          certFile:
                            description: CertFile is the path to the client certificate
                              file (mTLS).
                            type: string
                          enabled:
                            default: false
                            description: Enabled enables TLS for the Redis connection.
                            type: boolean
                          insecureSkipVerify:
                            description: InsecureSkipVerify skips server certificate
                              verification (dev only).
                            type: boolean
                          keyFile:
                            description: KeyFile is the path to the client private
                              key file (mTLS).
                            type: string
                          maxVersion:
                            description: MaxVersion is the maximum TLS version.
                            enum:
                            - TLS12
                            - TLS13
                            type: string
                          minVersion:
                            description: MinVersion is the minimum TLS version (TLS12,
                              TLS13).
                            enum:
                            - TLS12
                            - TLS13
                            type: string
                        required:
                        - enabled
                        type: object
                      url:
                        description: |-
                          URL is the Redis connection URL for standalone mode.
                          Format: redis://[user:password@]host:port[/db]
                          Mutually exclusive with Sentinel configuration.
                        type: string
                      writeTimeout:
                        description: WriteTimeout is the timeout for write operations.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                    type: object
                  requestsPerSecond:
                    description: RequestsPerSecond is the maximum requests per second.
                    minimum: 1
                    type: integer
                  store:
                    default: memory
                    description: |-
                      Store is the rate limiter state store (memory, redis).
                      "memory" keeps token buckets local to each gateway instance;
                      "redis" shares token buckets across gateway instances through
                      Redis (standalone or Sentinel) for distributed rate limiting.
                    enum:
                    - memory
                    - redis
                    type: string
                required:
                - burst
                - enabled
                - requestsPerSecond
                type: object
              separator:
                description: |-
                  Separator overrides the global namespacing separator for this upstream
                  (HUB-162). Must be a subset of A-Za-z0-9_.-.
                type: string
              timeouts:
                description: Timeouts configures per-method/per-tool timeouts (HUB-243).
                properties:
                  default:
                    description: Default is the fallback timeout when no per-method/per-tool
                      override applies.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                  perMethod:
                    additionalProperties:
                      description: Duration is a string representation of a duration
                        (e.g., "30s", "5m", "1h").
                      pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                      type: string
                    description: PerMethod maps an MCP method name to its timeout.
                    type: object
                  perTool:
                    additionalProperties:
                      description: Duration is a string representation of a duration
                        (e.g., "30s", "5m", "1h").
                      pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                      type: string
                    description: PerTool maps a de-namespaced tool name to its timeout.
                    type: object
                type: object
              tls:
                description: |-
                  TLS contains TLS configuration for connecting to the upstream
                  (including Vault PKI mTLS, HUB-309).
                properties:
                  alpn:
                    description: ALPN protocols for negotiation.
                    items:
                      type: string
                    type: array
                  caFile:
                    description: CAFile is the path to the CA certificate for server
                      verification.
                    type: string
                  certFile:
                    description: CertFile is the path to the client certificate (for
                      mTLS).
                    type: string
                  cipherSuites:
                    description: CipherSuites is the list of allowed cipher suites.
                    items:
                      type: string
                    type: array
                  enabled:
                    default: false
                    description: Enabled enables TLS for backend connections.
                    type: boolean
                  insecureSkipVerify:
                    description: InsecureSkipVerify skips server certificate verification
                      (dev only).
                    type: boolean
                  keyFile:
                    description: KeyFile is the path to the client private key (for
                      mTLS).
                    type: string
                  maxVersion:
                    description: MaxVersion is the maximum TLS version.
                    enum:
                    - TLS12
                    - TLS13
                    type: string
                  minVersion:
                    description: MinVersion is the minimum TLS version (TLS12, TLS13).
                    enum:
                    - TLS12
                    - TLS13
                    type: string
                  mode:
                    default: SIMPLE
                    description: Mode specifies the TLS mode (SIMPLE, MUTUAL).
                    enum:
                    - SIMPLE
                    - MUTUAL
                    - INSECURE
                    type: string
                  serverName:
                    description: ServerName overrides the server name for TLS verification.
                    type: string
                  vault:
                    description: Vault configures Vault-based client certificate management.
                    properties:
                      altNames:
                        description: AltNames for certificate requests.
                        items:
                          type: string
                        type: array
                      commonName:
                        description: CommonName for certificate requests.
                        type: string
                      enabled:
                        default: false
                        description: Enabled enables Vault integration for client
                          certificates.
                        type: boolean
                      pkiMount:
                        description: PKIMount is the Vault PKI mount path.
                        type: string
                      role:
                        description: Role is the Vault PKI role name.
                        type: string
                      ttl:
                        description: TTL for certificate requests.
                        type: string
                    required:
                    - enabled
                    type: object
                required:
                - enabled
                type: object
              transport:
                description: |-
                  Transport selects the upstream transport. Only "streamable-http" is
                  supported in this iteration.
                type: string
              trustLevel:
                description: TrustLevel marks the upstream as "trusted" or "untrusted"
                  (HUB-401).
                enum:
                - trusted
                - untrusted
                type: string
            required:
            - hosts
            type: object
          status:
            description: MCPBackendStatus defines the observed state of MCPBackend.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the MCPBackend's state.
                items:
                  description: Condition represents a condition of a resource.
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable message indicating
                        details about the transition.
                      type: string
                    observedGeneration:
                      description: ObservedGeneration represents the .metadata.generation
                        that the condition was set based upon.
                      format: int64
                      type: integer
                    reason:
                      description: Reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition (True, False, Unknown).
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              healthyHosts:
                description: HealthyHosts is the number of healthy hosts.
                type: integer
              lastHealthCheck:
                description: LastHealthCheck is the timestamp of the last health check.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              totalHosts:
                description: TotalHosts is the total number of hosts.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
